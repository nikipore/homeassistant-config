substitutions:
  name: display-waschraum-lueftung
  friendly_name: Display Waschraum Lüftung

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  variant: ESP32S3
  cpu_frequency: 80MHz

logger:

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

  on_boot:
    then:
      - output.turn_on: display_power
      - light.turn_on: green_led

  on_shutdown: 
    then:
      - component.update: my_display
      - delay: 3s

api:
  encryption:
    key: dHjusSzRZTM1iEoJQJ72f4T2IxPPIdV1bHyyO02X5X0=

  on_client_connected:
    - display.page.show: pg_main
    - delay: 5s
    - component.update: my_display

output:
  - platform: gpio
    pin: GPIO6
    id: display_power
    inverted: True
    
  - platform: gpio
    pin: GPIO3
    id: green_led_pin
    inverted: True

light:
  - platform: binary
    output: green_led_pin
    id: green_led
    name: green_led

spi:
  clk_pin: GPIO12 # SCK
  mosi_pin: GPIO13 # SDO

i2c:
  sda: GPIO47
  scl: GPIO48

display:
  - platform: waveshare_epaper
    model: 1.54inv2
    cs_pin: GPIO11
    dc_pin: GPIO10 
    busy_pin: GPIO8
    reset_pin: GPIO9 
    update_interval: never
    reset_duration: 2ms
    full_update_every: 1
    rotation: 90
    id: my_display
    pages:
      - id: pg_offline # this page is shown by default initially
        lambda: |-
          it.printf(100, 100, id(font_24), TextAlign::CENTER, "Starting");
      - id: pg_main # this page is show once connected to HomeAssistant
        lambda: |-
          it.printf(138,2,id(font_16), TextAlign::RIGHT, "innen");
          it.printf(199,2,id(font_16), TextAlign::RIGHT, "aussen");
          it.printf(2,25,id(font_16), "Temperatur °C");
          it.printf(138,25,id(font_16), TextAlign::RIGHT, "%.1f", id(temperature).state);
          it.printf(199,25,id(font_16), TextAlign::RIGHT, "%.1f", id(temperature_outside).state);
          it.printf(2,48,id(font_16), "Feuchte rel %%");
          it.printf(138,48,id(font_16), TextAlign::RIGHT, "%.1f", id(relative_humidity).state);
          it.printf(199,48,id(font_16), TextAlign::RIGHT, "%.1f", id(relative_humidity_outside).state);
          it.printf(2,71,id(font_16), "- sim %%");
          it.printf(138,71,id(font_16), TextAlign::RIGHT, "%.1f", id(relative_humidity_simulated).state);
          it.printf(199,71,id(font_16), TextAlign::RIGHT, "%.1f", id(relative_humidity_outside).state);
          it.printf(2,94,id(font_16), "- abs g/m3");
          it.printf(138,94,id(font_16), TextAlign::RIGHT, "%.1f", id(absolute_humidity).state);
          it.printf(199,94,id(font_16), TextAlign::RIGHT, "%.1f", id(absolute_humidity_outside).state);
          it.printf(2,117,id(font_16), "Taupunkt °C");
          it.printf(138,117,id(font_16), TextAlign::RIGHT, "%.1f", id(dew_point).state);
          it.printf(199,117,id(font_16), TextAlign::RIGHT, "%.1f", id(dew_point_outside).state);

          it.printf(97,160,id(font_30), TextAlign::CENTER, "Fenster %s!", id(ventilate).state ? "auf" : "zu");

          it.strftime(0,199, id(font_16), TextAlign::BOTTOM_LEFT, "%Y-%m-%d", id(time_comp).now());
          it.strftime(199,199, id(font_16), TextAlign::BOTTOM_RIGHT, "%H:%M", id(time_comp).now());

font:
  - file: "gfonts://Roboto"
    id: font_30
    size: 30
  - file: "gfonts://Roboto"
    id: font_24
    size: 24
  - file: "gfonts://Roboto"
    id: font_20
    size: 20
  - file: "gfonts://Roboto"
    id: font_18
    size: 18
  - file: "gfonts://Roboto"
    id: font_16
    size: 16

binary_sensor:
  - platform: template
    name: "Lüftungsempfehlung"
    id: ventilate
    lambda: |-
      return id(absolute_humidity).state > id(absolute_humidity_outside).state;

  - platform: status
    name: "Node Status"
    id: system_status

  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Settings"
    id: button_settings

  - platform: gpio
    pin:
      number: GPIO18
      inverted: true
      mode: 
        input: true
        pullup: true
    name: "Power"
    id: button_power

time:
  - platform: homeassistant
    id: time_comp
    timezone: "Europe/Berlin"

sensor:
  - platform: homeassistant
    name: "Temperatur außen"
    entity_id: sensor.weather_temperature
    id: temperature_outside
  - platform: homeassistant
    name: "relative Luftfeuchtigkeit außen"
    entity_id: sensor.weather_humidity
    id: relative_humidity_outside
  - platform: homeassistant
    name: "absolute Luftfeuchtigkeit außen"
    entity_id: sensor.wetter_absolute_humidity
    id: absolute_humidity_outside
  - platform: homeassistant
    name: "Taupunkt außen"
    entity_id: sensor.wetter_dew_point
    id: dew_point_outside

  - platform: homeassistant
    name: "Temperatur"
    entity_id: sensor.temperature_sensor_waschraum_temperature
    id: temperature
  - platform: homeassistant
    name: "relative Luftfeuchtigkeit"
    entity_id: sensor.temperature_sensor_waschraum_humidity
    id: relative_humidity
  - platform: homeassistant
    name: "absolute Luftfeuchtigkeit"
    entity_id: sensor.waschraum_absolute_humidity
    id: absolute_humidity
  - platform: homeassistant
    name: "Taupunkt"
    entity_id: sensor.waschraum_dew_point
    id: dew_point
  - platform: homeassistant
    name: "relative Luftfeuchtigkeit nach Lüftung"
    entity_id: sensor.waschraum_ventilate_relative_humidity_simulated
    id: relative_humidity_simulated

button:
  - platform: template # to force a display update from HomeAssistant
    name: "display update"
    on_press: 
      then:
        - component.update: my_display
