substitutions:
  name: display-waschraum-lueftung
  friendly_name: Display Waschraum Lüftung

api:
  encryption:
    key: dHjusSzRZTM1iEoJQJ72f4T2IxPPIdV1bHyyO02X5X0=

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

  on_boot:
    then:
      - output.turn_on: epd_power_enable
      - display.page.show: page1

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  variant: ESP32S3
  cpu_frequency: 80MHz

logger:

output:
  - platform: gpio
    pin: GPIO6 # EPD3V3_EN pin GHF: Required by the ePaper display!!!
    id: epd_power_enable
    inverted: True
    
  - platform: gpio
    pin: GPIO3
    id: green_led_pin
    inverted: True

light:
  - platform: binary
    output: green_led_pin
    id: green_led
    name: green_led

i2c:
  sda: GPIO15
  scl: GPIO16
  scan: True

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO13

font:       
  - file: "gfonts://Montserrat"
    id: clock_font
    size: 72                  # +50% compared to montserrat_48
    bpp: 4                    # anti-aliasing: smooth edges at large sizes
    glyphs: "0123456789:-"    # only the characters used by the clock (HH:MM and "--:--")
  # Material Design Icons font (same icons as Home Assistant)
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons
    size: 40
    bpp: 4
    glyphs:
      - "\U000F06E8"   # mdi:lightbulb-on  (Light icon, left)
      - "\U000F07E5"   # mdi:pipe          (Recirculation icon, right)

display:
  - platform: waveshare_epaper
    id: epd_display
    cs_pin: GPIO11
    dc_pin: GPIO10
    busy_pin: GPIO8
    reset_pin: GPIO9
    model: 1.54in
    full_update_every: 30
    update_interval: 15s
    reset_duration: 2ms
    lambda: |-
      it.print(it.get_width() / 2, it.get_height() / 2, id(font1), "Hello World!");