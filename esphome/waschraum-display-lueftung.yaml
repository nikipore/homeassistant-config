substitutions:
  name: display-waschraum-lueftung
  friendly_name: Display Waschraum Lüftung

api:
  encryption:
    key: dHjusSzRZTM1iEoJQJ72f4T2IxPPIdV1bHyyO02X5X0=

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

  on_boot:
    then:
      - output.turn_on: epd_power_enable

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  variant: ESP32S3
  cpu_frequency: 80MHz




spi:
  clk_pin: GPIO7      # SCK
  mosi_pin: GPIO9     # MOSI

display:
  - platform: waveshare_epaper
    model: 1.54inv2
    id: epd
    cs_pin: GPIO2
    dc_pin: GPIO4
    reset_pin: GPIO1
    busy_pin: GPIO3
    update_interval: never
    rotation: 270
    full_update_every: 1

    lambda: |-
      it.printf(5, 5, id(font_roboto), "Living Room:");

font:
  - file:
      type: gfonts
      family: Source Code Pro
      weight: 700
    id: font_roboto
    size: 26
  - file: "gfonts://Roboto"
    id: roboto_20
    size: 20