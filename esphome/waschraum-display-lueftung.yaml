substitutions:
  name: display-waschraum-lueftung
  friendly_name: Display Waschraum Lüftung
packages:
  esphome.esp_web_tools_example: github://esphome/firmware/esp-web-tools/esp32s3.yaml@main
esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
api:
  encryption:
    key: dHjusSzRZTM1iEoJQJ72f4T2IxPPIdV1bHyyO02X5X0=


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO13
  mosi_pin: GPIO14

display:
  - platform: waveshare_epaper
    id: waveshare
    model: 1.54in
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: True
    dc_pin: GPIO27
    busy_pin: 
      number: GPIO25
      inverted: true
    reset_pin: GPIO26
    lambda: |-