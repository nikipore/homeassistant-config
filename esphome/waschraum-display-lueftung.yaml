substitutions:
  name: display-waschraum-lueftung
  friendly_name: Display Waschraum Lüftung

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  variant: ESP32S3
  cpu_frequency: 80MHz

logger:

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

  on_boot:
    then:
      - output.turn_on: display_power
      - light.turn_on: green_led
      - display.page.show: page_main

api:
  encryption:
    key: dHjusSzRZTM1iEoJQJ72f4T2IxPPIdV1bHyyO02X5X0=
  
output:
  - platform: gpio
    pin: GPIO6
    id: display_power
    inverted: True
    
  - platform: gpio
    pin: GPIO3
    id: green_led_pin
    inverted: True

light:
  - platform: binary
    output: green_led_pin
    id: green_led
    name: green_led

spi:
  clk_pin: GPIO12 # SCK
  mosi_pin: GPIO13 # SDO

i2c:
  sda: GPIO47
  scl: GPIO48

display:
  - platform: waveshare_epaper
    model: 1.54inv2
    cs_pin: GPIO11
    dc_pin: GPIO10 
    busy_pin: GPIO8
    reset_pin: GPIO9 
    update_interval: never
    reset_duration: 2ms
    full_update_every: 30
    rotation: 0
    id: screen
    pages:
      - id: page_main
        lambda: |-
          it.printf(142,2,id(font_normal), TextAlign::RIGHT, "innen");
          it.printf(199,2,id(font_normal), TextAlign::RIGHT, "aussen");
          it.printf(2,22,id(font_normal), "Temperatur");
          it.printf(144,22,id(font_normal), TextAlign::RIGHT, "%.0f°C", id(temperature).state);
          it.printf(199,22,id(font_normal), TextAlign::RIGHT, "%.0f°C", id(temperature_outside).state);
          it.printf(2,42,id(font_normal), "Feuchte");
          it.printf(144,42,id(font_normal), TextAlign::RIGHT, "%.0f%%", id(relative_humidity).state);
          it.printf(199,42,id(font_normal), TextAlign::RIGHT, "%.0f%%", id(relative_humidity_outside).state);
          it.printf(2,62,id(font_normal), "- gelueftet");
          it.printf(144,62,id(font_normal), TextAlign::RIGHT, "%.0f%%", id(relative_humidity_simulated).state);
          it.printf(199,62,id(font_normal), TextAlign::RIGHT, "%.0f%%", id(relative_humidity_outside).state);
          it.printf(2,82,id(font_normal), "- absolut je m3");
          it.printf(144,82,id(font_normal), TextAlign::RIGHT, "%.0fg", id(absolute_humidity).state);
          it.printf(199,82,id(font_normal), TextAlign::RIGHT, "%.0fg", id(absolute_humidity_outside).state);
          it.printf(2,102,id(font_normal), "Taupunkt");
          it.printf(144,102,id(font_normal), TextAlign::RIGHT, "%.0f°C", id(dew_point).state);
          it.printf(199,102,id(font_normal), TextAlign::RIGHT, "%.0f°C", id(dew_point_outside).state);

          it.filled_rectangle(0, 127, 200, 4);
          it.printf(99,150,id(font_large), TextAlign::CENTER, "Fenster %s!", id(ventilate).state ? "auf" : "zu");
          it.filled_rectangle(0, 170, 200, 4);

          it.strftime(0,199, id(font_normal), TextAlign::BOTTOM_LEFT, "%d.%m.%Y", id(now).now());
          it.strftime(199,199, id(font_normal), TextAlign::BOTTOM_RIGHT, "%H:%M", id(now).now());

font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 36
  - file: "gfonts://Roboto"
    id: font_normal
    size: 16

binary_sensor:
  - platform: template
    name: "Lüftungsempfehlung"
    id: ventilate
    lambda: |-
      return id(absolute_humidity).state > id(absolute_humidity_outside).state;

  - platform: status
    name: "Node Status"
    id: system_status

  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Settings"
    id: button_settings

  - platform: gpio
    pin:
      number: GPIO18
      inverted: true
      mode: 
        input: true
        pullup: true
    name: "Power"
    id: button_power

time:
  - platform: homeassistant
    id: now
    timezone: "Europe/Berlin"

    on_time:
      - seconds: 0
        minutes: /1 # every minute
        then:
          - component.update: screen

sensor:
  - platform: homeassistant
    name: "Temperatur außen"
    entity_id: sensor.weather_temperature
    id: temperature_outside
  - platform: homeassistant
    name: "relative Luftfeuchtigkeit außen"
    entity_id: sensor.weather_humidity
    id: relative_humidity_outside
  - platform: homeassistant
    name: "absolute Luftfeuchtigkeit außen"
    entity_id: sensor.wetter_absolute_humidity
    id: absolute_humidity_outside
  - platform: homeassistant
    name: "Taupunkt außen"
    entity_id: sensor.wetter_dew_point
    id: dew_point_outside

  - platform: homeassistant
    name: "Temperatur"
    entity_id: sensor.temperature_sensor_waschraum_temperature
    id: temperature
  - platform: homeassistant
    name: "relative Luftfeuchtigkeit"
    entity_id: sensor.temperature_sensor_waschraum_humidity
    id: relative_humidity
  - platform: homeassistant
    name: "absolute Luftfeuchtigkeit"
    entity_id: sensor.waschraum_absolute_humidity
    id: absolute_humidity
  - platform: homeassistant
    name: "Taupunkt"
    entity_id: sensor.waschraum_dew_point
    id: dew_point
  - platform: homeassistant
    name: "relative Luftfeuchtigkeit nach Lüftung"
    entity_id: sensor.waschraum_ventilate_relative_humidity_simulated
    id: relative_humidity_simulated

button:
  - platform: template # to force a display update from HomeAssistant
    name: "display update"
    on_press: 
      then:
        - component.update: screen
