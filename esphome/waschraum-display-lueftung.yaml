substitutions:
  name: display-waschraum-lueftung
  friendly_name: Display Waschraum Lüftung

api:
  encryption:
    key: dHjusSzRZTM1iEoJQJ72f4T2IxPPIdV1bHyyO02X5X0=


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO7      # SCK
  mosi_pin: GPIO9     # MOSI

display:
  - platform: waveshare_epaper
    model: 1.54inv2
    id: epd
    cs_pin: GPIO2
    dc_pin: GPIO4
    reset_pin: GPIO1
    busy_pin: GPIO3
    update_interval: never
    rotation: 270
    full_update_every: 1

    lambda: |-
      it.printf(5, 5, id(font_roboto), "Living Room:");

font:
  - file:
      type: gfonts
      family: Source Code Pro
      weight: 700
    id: font_roboto
    size: 26
  - file: "gfonts://Roboto"
    id: roboto_20
    size: 20